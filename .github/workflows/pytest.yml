name: Run Pytest

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up the Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred Python version
        cache: 'pip'           # Caches pip dependencies to speed up subsequent runs

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Start frontend
      working-directory: frontend
      run: npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &

    - name: Wait for frontend
      run: |
        for attempt in {1..30}; do
          if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
            exit 0
          fi
          sleep 1
        done
        cat frontend/frontend.log
        exit 1

    # Step 3: Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest # Ensures pytest itself is installed

    # Step 4: Execute the test suite
    - name: Run tests with pytest
      run: |
        pytest -v
